name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, Typecheck & Test (Python 3.15 + PostgreSQL 19)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:19
        env:
          POSTGRES_USER: vcraft
          POSTGRES_PASSWORD: vcraft
          POSTGRES_DB: vcraft_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vcraft -d vcraft_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+psycopg://vcraft:vcraft@localhost:5432/vcraft_test
      TEST_DATABASE_URL: postgresql+psycopg://vcraft:vcraft@localhost:5432/vcraft_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.15
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate Docker Compose configuration
        run: docker compose config -q

      - name: Lint and format check (Ruff)
        run: |
          ruff check app tests alembic scripts
          ruff format --check app tests alembic scripts

      - name: Typecheck (Mypy)
        run: mypy

      - name: Run database migrations (Alembic)
        run: alembic upgrade head

      - name: Run test suite (Pytest)
        run: pytest
