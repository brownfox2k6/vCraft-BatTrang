repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.6
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy (strict typecheck)
        entry: bash -c 'if [ -x .venv/bin/mypy ]; then exec .venv/bin/mypy app tests alembic/env.py; else exec mypy app tests alembic/env.py; fi'
        language: system
        types: [python]
        pass_filenames: false
