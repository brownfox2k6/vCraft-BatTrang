<!DOCTYPE html>
<html lang="{{ lang }}" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% if page_title %}{{ page_title }} | {{ t("site.title_default") }}{% else %}{{ t("site.title_default") }}{% endif %}{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}{{ t('site.meta_description') }}{% endblock %}">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
  <script>
    (() => {
      let saved = null;
      try {
        const value = localStorage.getItem("vcraft-theme");
        if (value === "dark" || value === "light") saved = value;
      } catch {}
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", saved === "dark" || (saved === null && prefersDark));
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ static_url('/static/css/app.css') }}">
  {% block head_extra %}{% endblock %}
</head>
<body class="{% block body_class %}min-h-screen bg-cream text-ink font-sans antialiased selection:bg-cobalt/15 selection:text-cobalt{% endblock %}">
  <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-50 focus:rounded-lg focus:bg-cobalt-action focus:px-4 focus:py-2 focus:text-sm focus:font-semibold focus:text-on-cobalt">
    {{ t("site.skip_to_content") }}
  </a>

  {% block document_body %}{% endblock %}

  <script type="module" src="/static/js/theme.js" defer></script>
  <script type="module" src="/static/js/layout.js" defer></script>
  {% block scripts_extra %}{% endblock %}
</body>
</html>
