<img
  src="{{ medium_url }}"
  srcset="{{ thumb_url }} 400w, {{ medium_url }} 960w, {{ large_url }} 1600w"
  sizes="{{ sizes | default('(max-width: 640px) 100vw, 400px') }}"
  alt="{{ alt | default('') }}"
  {% if width %}width="{{ width }}"{% endif %}
  {% if height %}height="{{ height }}"{% endif %}
  loading="{{ loading | default('lazy') }}"
  decoding="async"
  {% if css_class %}class="{{ css_class }}"{% endif %}
>
