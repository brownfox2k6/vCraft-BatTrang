[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vcraft-battrang"
version = "0.1.0"
description = "vCraft Bat Trang - Digital craft village exhibition, QR traceability, interactive map, and multi-artisan RFQ platform."
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]",
    "sqlalchemy",
    "alembic",
    "psycopg[binary,pool]",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "mypy",
    "ruff",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]
